<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dethember Game - Custom Stage v0.5</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #030303;
      color: #c0c0c0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin-bottom: 10px;
      color: #791b1b;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 20px;
    }

    #gameCanvas {
      border: 2px solid #791b1b;
      box-shadow: 0 0 35px rgba(121, 27, 27, 0.6);
      background-color: #050507;
      display: block;
      max-width: 95vw;
      max-height: 80vh;
    }

    .controls-info {
      margin-top: 12px;
      font-size: 13px;
      color: #777;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>DETHEMBER - THE RED REALM</h1>
  <canvas id="gameCanvas" width="1280" height="640"></canvas>

  <div class="controls-info">
    Move: <strong>A / D</strong> or <strong>Left / Right Arrows</strong> | 
    Jump: <strong>W / Space / Up</strong> | 
    Attack: <strong>J / Z</strong>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Load Wide Background (2400 x 448)
    const bgImage = new Image();
    bgImage.src = 'background .jpg';

    // Load Character Sprites
    const sprites = {
      idle: new Image(),
      front: new Image(),
      side: new Image(),
      back: new Image(),
      walk: new Image(),
      attack: new Image(),
      jump: new Image(),
      hurt: new Image(),
      death: new Image()
    };

    sprites.idle.src = 'Jane idle.png';
    sprites.front.src = 'Jane front.png';
    sprites.side.src = 'Jane Side.png';
    sprites.back.src = 'Jane back.png';
    sprites.walk.src = 'Jane walk.png';
    sprites.attack.src = 'Jane attack.png';
    sprites.jump.src = 'Jane jump.png';
    sprites.hurt.src = 'Jane hurt.png';
    sprites.death.src = 'Jane death.png';

    // World & Scaling Configuration
    const bgOrigW = 2400;
    const bgOrigH = 448;
    // Scale background height to match canvas height (640px), maintaining aspect ratio for width
    const worldHeight = canvas.height;
    const worldWidth = bgOrigW * (worldHeight / bgOrigH); // ~3428px wide world

    // Ground line aligned with the rocky terrain in your background
    const groundY = 530;

    // Scale factor to fit Jane perfectly into the 640px height canvas
    const spriteScale = 0.65;

    // Camera and Player State
    const camera = {
      x: 0,
      width: canvas.width,
      maxX: worldWidth - canvas.width
    };

    const player = {
      x: 200, // World X position
      y: groundY - 250,
      vx: 0,
      vy: 0,
      speed: 6,
      jumpStrength: -15,
      gravity: 0.65,
      isGrounded: false,
      facingRight: true,
      isAttacking: false,
      attackTimer: 0,
      currentSprite: sprites.idle
    };

    const keys = { left: false, right: false, up: false };

    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = true;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = true;
      if (['ArrowUp', 'w', 'W', ' '].includes(e.key)) keys.up = true;
      if (['j', 'J', 'z', 'Z'].includes(e.key) && !player.isAttacking) {
        player.isAttacking = true;
        player.attackTimer = 22;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = false;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = false;
      if (['ArrowUp', 'w', 'W', ' '].includes(e.key)) keys.up = false;
    });

    function update() {
      // Horizontal Movement
      if (keys.left) {
        player.vx = -player.speed;
        player.facingRight = false;
      } else if (keys.right) {
        player.vx = player.speed;
        player.facingRight = true;
      } else {
        player.vx = 0;
      }

      // Jump Logic
      if (keys.up && player.isGrounded) {
        player.vy = player.jumpStrength;
        player.isGrounded = false;
      }

      // Apply Physics
      player.x += player.vx;
      player.vy += player.gravity;
      player.y += player.vy;

      // Ground Collision
      const activeImg = player.currentSprite;
      const baseHeight = activeImg.naturalHeight || 300;
      const currentScaledHeight = baseHeight * spriteScale;

      if (player.y + currentScaledHeight >= groundY) {
        player.y = groundY - currentScaledHeight;
        player.vy = 0;
        player.isGrounded = true;
      }

      // World Boundary Limits
      if (player.x < 20) player.x = 20;
      if (player.x > worldWidth - 120) player.x = worldWidth - 120;

      // Camera Tracking (Follows player horizontally across the 2400+ px world)
      camera.x = player.x - canvas.width / 2;
      if (camera.x < 0) camera.x = 0;
      if (camera.x > camera.maxX) camera.x = camera.maxX;

      // Attack Timer
      if (player.isAttacking) {
        player.attackTimer--;
        if (player.attackTimer <= 0) {
          player.isAttacking = false;
        }
      }

      // Select Sprite State
      if (player.isAttacking) {
        player.currentSprite = sprites.attack;
      } else if (!player.isGrounded) {
        player.currentSprite = sprites.jump;
      } else if (player.vx !== 0) {
        player.currentSprite = sprites.walk;
      } else {
        player.currentSprite = sprites.idle;
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render Parallax / Scrolling Background
      if (bgImage.complete && bgImage.naturalWidth !== 0) {
        ctx.drawImage(bgImage, -camera.x, 0, worldWidth, worldHeight);
      } else {
        ctx.fillStyle = '#100508';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Render Character (Translated by camera position)
      const activeImg = player.currentSprite;
      if (activeImg.complete && activeImg.naturalWidth !== 0) {
        ctx.save();
        
        const renderWidth = activeImg.naturalWidth * spriteScale;
        const renderHeight = activeImg.naturalHeight * spriteScale;
        // Screen position = World position - Camera position
        const screenX = player.x - camera.x;

        if (!player.facingRight) {
          ctx.translate(screenX + renderWidth, player.y);
          ctx.scale(-1, 1);
          ctx.drawImage(activeImg, 0, 0, renderWidth, renderHeight);
        } else {
          ctx.drawImage(activeImg, screenX, player.y, renderWidth, renderHeight);
        }
        ctx.restore();
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
