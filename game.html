<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dethember Game - Mobile & Desktop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #050505;
      color: #c0c0c0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }

    h1 {
      margin-bottom: 10px;
      color: #791b1b;
      letter-spacing: 2px;
      font-size: 1.2rem;
    }

    .game-container {
      position: relative;
      width: 100%;
      max-width: 960px;
    }

    #gameCanvas {
      border: 2px solid #791b1b;
      box-shadow: 0 0 25px rgba(121, 27, 27, 0.6);
      background-color: #08080a;
      display: block;
      width: 100%;
      height: auto;
    }

    .controls-info {
      margin-top: 10px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }

    /* Mobile Virtual Controls */
    .mobile-controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 960px;
      padding: 10px 15px;
      box-sizing: border-box;
    }

    .d-pad, .action-btns {
      display: flex;
      gap: 10px;
    }

    .btn {
      width: 60px;
      height: 60px;
      background: rgba(121, 27, 27, 0.4);
      border: 2px solid #791b1b;
      color: #fff;
      font-weight: bold;
      font-size: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .btn:active {
      background: rgba(170, 30, 30, 0.8);
    }
  </style>
</head>
<body>

  <h1>DETHEMBER GAME - TEST RUN</h1>
  
  <div class="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
  </div>

  <!-- On-screen controls for phones and tablets -->
  <div class="mobile-controls">
    <div class="d-pad">
      <button class="btn" id="btnLeft">◄</button>
      <button class="btn" id="btnRight">►</button>
    </div>
    <div class="action-btns">
      <button class="btn" id="btnJump">▲</button>
      <button class="btn" id="btnAttack">ATK</button>
    </div>
  </div>

  <div class="controls-info">
    Keyboard: <strong>A / D / W</strong> or <strong>Arrows</strong> | Jump: <strong>Space</strong> | Attack: <strong>J / Z</strong>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Load Stage Background
    const bgImage = new Image();
    bgImage.src = 'BGDARK.png';

    // Load Individual Move PNGs with exact Jane filenames
    const sprites = {
      idle: new Image(),
      front: new Image(),
      side: new Image(),
      back: new Image(),
      walk: new Image(),
      attack: new Image(),
      jump: new Image(),
      hurt: new Image(),
      death: new Image()
    };

    sprites.idle.src = 'Jane idle.png';
    sprites.front.src = 'Jane front.png';
    sprites.side.src = 'Jane Side.png';
    sprites.back.src = 'Jane back.png';
    sprites.walk.src = 'Jane walk.png';
    sprites.attack.src = 'Jane attack.png';
    sprites.jump.src = 'Jane jump.png';
    sprites.hurt.src = 'Jane hurt.png';
    sprites.death.src = 'Jane death.png';

    // Character Base Dimensions
    const CHAR_WIDTH = 142;
    const CHAR_HEIGHT = 250;

    // Ground Baseline
    const groundY = 480;

    // Player State & Calibrated Physics for Normal Speed
    const player = {
      x: 120,
      y: groundY - CHAR_HEIGHT,
      vx: 0,
      vy: 0,
      speed: 2.8,           // Reduced from 4.5 for walking
      jumpStrength: -9.5,   // Reduced from -13 for lower jump velocity
      gravity: 0.35,        // Reduced from 0.6 for floatier, realistic descent
      isGrounded: false,
      facingRight: true,
      isAttacking: false,
      attackTimer: 0,
      currentSprite: sprites.idle
    };

    const keys = { left: false, right: false, up: false };

    // Keyboard Listeners (Desktop)
    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = true;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = true;
      if (['ArrowUp', 'w', 'W', ' '].includes(e.key)) keys.up = true;
      if (['j', 'J', 'z', 'Z'].includes(e.key) && !player.isAttacking) {
        player.isAttacking = true;
        player.attackTimer = 35; // Increased from 18 frames to hold attack stance longer
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = false;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = false;
      if (['ArrowUp', 'w', 'W', ' '].includes(e.key)) keys.up = false;
    });

    // Mobile Touch Controller Setup
    function bindTouchBtn(btnId, actionStart, actionEnd) {
      const btn = document.getElementById(btnId);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); actionStart(); });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); actionEnd(); });
      btn.addEventListener('mousedown', (e) => { e.preventDefault(); actionStart(); });
      btn.addEventListener('mouseup', (e) => { e.preventDefault(); actionEnd(); });
    }

    bindTouchBtn('btnLeft', () => { keys.left = true; }, () => { keys.left = false; });
    bindTouchBtn('btnRight', () => { keys.right = true; }, () => { keys.right = false; });
    bindTouchBtn('btnJump', () => { keys.up = true; }, () => { keys.up = false; });
    bindTouchBtn('btnAttack', () => {
      if (!player.isAttacking) {
        player.isAttacking = true;
        player.attackTimer = 35;
      }
    }, () => {});

    function update() {
      // Horizontal Movement
      if (keys.left) {
        player.vx = -player.speed;
        player.facingRight = false;
      } else if (keys.right) {
        player.vx = player.speed;
        player.facingRight = true;
      } else {
        player.vx = 0;
      }

      // Jump Logic
      if (keys.up && player.isGrounded) {
        player.vy = player.jumpStrength;
        player.isGrounded = false;
      }

      // Apply Physics
      player.x += player.vx;
      player.vy += player.gravity;
      player.y += player.vy;

      // Ground Collision
      if (player.y + CHAR_HEIGHT >= groundY) {
        player.y = groundY - CHAR_HEIGHT;
        player.vy = 0;
        player.isGrounded = true;
      }

      // Canvas Boundaries
      if (player.x < -20) player.x = -20;
      if (player.x > canvas.width - CHAR_WIDTH + 20) player.x = canvas.width - CHAR_WIDTH + 20;

      // Attack Duration Timer
      if (player.isAttacking) {
        player.attackTimer--;
        if (player.attackTimer <= 0) {
          player.isAttacking = false;
        }
      }

      // Select Active Sprite State
      if (player.isAttacking) {
        player.currentSprite = sprites.attack;
      } else if (!player.isGrounded) {
        player.currentSprite = sprites.jump;
      } else if (player.vx !== 0) {
        player.currentSprite = sprites.walk;
      } else {
        player.currentSprite = sprites.idle;
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render Background Stage
      if (bgImage.complete && bgImage.naturalWidth !== 0) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#0f0a0a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Render Floor Line
      ctx.strokeStyle = '#4a0e0e';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();

      // Render Character Sprite
      const activeImg = player.currentSprite;
      if (activeImg.complete && activeImg.naturalWidth !== 0) {
        ctx.save();

        if (!player.facingRight) {
          ctx.translate(player.x + CHAR_WIDTH, player.y);
          ctx.scale(-1, 1);
          ctx.drawImage(activeImg, 0, 0, CHAR_WIDTH, CHAR_HEIGHT);
        } else {
          ctx.drawImage(activeImg, player.x, player.y, CHAR_WIDTH, CHAR_HEIGHT);
        }
        ctx.restore();
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
