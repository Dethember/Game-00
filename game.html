<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dethember Game - Prototype v0.4</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050505;
      color: #c0c0c0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin-bottom: 12px;
      color: #791b1b;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #gameCanvas {
      border: 2px solid #791b1b;
      box-shadow: 0 0 30px rgba(121, 27, 27, 0.7);
      background-color: #08080a;
      display: block;
      max-width: 95vw;
      max-height: 80vh;
    }

    .controls-info {
      margin-top: 15px;
      font-size: 14px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>DETHEMBER GAME - TEST RUN</h1>
  <canvas id="gameCanvas" width="1280" height="720"></canvas>

  <div class="controls-info">
    Movement: <strong>A / D</strong> or <strong>Left / Right Arrows</strong> | 
    Jump: <strong>W / Space / Up Arrow</strong> | 
    Attack: <strong>J / Z</strong>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Load Stage Background
    const bgImage = new Image();
    bgImage.src = 'BGDARK.png';

    // Load New Character Sprites
    const sprites = {
      idle: new Image(),
      front: new Image(),
      side: new Image(),
      back: new Image(),
      walk: new Image(),
      attack: new Image(),
      jump: new Image(),
      hurt: new Image(),
      death: new Image()
    };

    sprites.idle.src = 'Jane idle.png';
    sprites.front.src = 'Jane front.png';
    sprites.side.src = 'Jane Side.png';
    sprites.back.src = 'Jane back.png';
    sprites.walk.src = 'Jane walk.png';
    sprites.attack.src = 'Jane attack.png';
    sprites.jump.src = 'Jane jump.png';
    sprites.hurt.src = 'Jane hurt.png';
    sprites.death.src = 'Jane death.png';

    // Ground Baseline (Adjusted for higher canvas height)
    const groundY = 620;

    // Scale Multiplier for Character Rendering
    const spriteScale = 2.0;

    // Player State & Physics
    const player = {
      x: 150,
      y: groundY - 200,
      vx: 0,
      vy: 0,
      speed: 5.5,
      jumpStrength: -15,
      gravity: 0.65,
      isGrounded: false,
      facingRight: true,
      isAttacking: false,
      attackTimer: 0,
      currentSprite: sprites.idle
    };

    const keys = { left: false, right: false, up: false };

    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = true;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = true;
      if (['ArrowUp', 'w', 'W', ' '].includes(e.key)) keys.up = true;
      if (['j', 'J', 'z', 'Z'].includes(e.key) && !player.isAttacking) {
        player.isAttacking = true;
        player.attackTimer = 22;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = false;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = false;
      if (['ArrowUp', 'w', 'W', ' '].includes(e.key)) keys.up = false;
    });

    function update() {
      // Horizontal Movement
      if (keys.left) {
        player.vx = -player.speed;
        player.facingRight = false;
      } else if (keys.right) {
        player.vx = player.speed;
        player.facingRight = true;
      } else {
        player.vx = 0;
      }

      // Jump Logic
      if (keys.up && player.isGrounded) {
        player.vy = player.jumpStrength;
        player.isGrounded = false;
      }

      // Apply Physics
      player.x += player.vx;
      player.vy += player.gravity;
      player.y += player.vy;

      // Active image height scaled for ground collision calculation
      const baseHeight = player.currentSprite.naturalHeight || 200;
      const currentScaledHeight = baseHeight * spriteScale;

      // Ground Collision
      if (player.y + currentScaledHeight >= groundY) {
        player.y = groundY - currentScaledHeight;
        player.vy = 0;
        player.isGrounded = true;
      }

      // Canvas Boundaries
      if (player.x < -30) player.x = -30;
      if (player.x > canvas.width - 150) player.x = canvas.width - 150;

      // Attack Duration Timer
      if (player.isAttacking) {
        player.attackTimer--;
        if (player.attackTimer <= 0) {
          player.isAttacking = false;
        }
      }

      // Select Active Sprite State
      if (player.isAttacking) {
        player.currentSprite = sprites.attack;
      } else if (!player.isGrounded) {
        player.currentSprite = sprites.jump;
      } else if (player.vx !== 0) {
        player.currentSprite = sprites.walk;
      } else {
        player.currentSprite = sprites.idle;
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render Stage Background
      if (bgImage.complete && bgImage.naturalWidth !== 0) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#0a080c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Render Floor Baseline
      ctx.strokeStyle = '#5c1212';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();

      // Render Character Sprite dynamically using image natural dimensions & scale
      const activeImg = player.currentSprite;
      if (activeImg.complete && activeImg.naturalWidth !== 0) {
        ctx.save();
        
        const renderWidth = activeImg.naturalWidth * spriteScale;
        const renderHeight = activeImg.naturalHeight * spriteScale;

        if (!player.facingRight) {
          ctx.translate(player.x + renderWidth, player.y);
          ctx.scale(-1, 1);
          ctx.drawImage(activeImg, 0, 0, renderWidth, renderHeight);
        } else {
          ctx.drawImage(activeImg, player.x, player.y, renderWidth, renderHeight);
        }
        ctx.restore();
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
